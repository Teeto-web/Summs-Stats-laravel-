services:
  # PHP-FPM : fait tourner le code Laravel
  app:
    build:
      context: ./docker/php
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    container_name: summs_app
    volumes:
      - ./:/var/www/html
    depends_on:
      mysql:
        condition: service_healthy

  # Nginx : serveur web, reçoit les requêtes et les transmet à PHP
  nginx:
    image: nginx:alpine
    container_name: summs_nginx
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

  # Base de données MySQL (les identifiants viennent du fichier .env de Laravel)
  mysql:
    image: mysql:9.7
    container_name: summs_mysql
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10

  # File d'attente : traite les téléchargements de parties en arrière-plan
  queue:
    build:
      context: ./docker/php
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    container_name: summs_queue
    command: php artisan queue:work --tries=3 --sleep=3
    volumes:
      - ./:/var/www/html
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

  # Planificateur de tâches Laravel (remplace le cron)
  scheduler:
    build:
      context: ./docker/php
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    container_name: summs_scheduler
    command: php artisan schedule:work
    volumes:
      - ./:/var/www/html
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

  # phpMyAdmin : interface web pour voir la base (développement uniquement)
  phpmyadmin:
    image: phpmyadmin:latest
    container_name: summs_phpmyadmin
    ports:
      - "8081:80"
    environment:
      PMA_HOST: mysql
    depends_on:
      - mysql

volumes:
  mysql_data:
